name: Update Recent Activity

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  schedule:
    - cron: "*/30 * * * *"   # runs every 30 minutes
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-recent-activity
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update README with recent activity
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch recent public events
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/users/aayushkumar5/events/public?per_page=5" > recent-events.json

          jq -e 'type == "array"' recent-events.json > /dev/null

          jq -r '
            .[] |
            if .type == "PushEvent" then
              "- 📝 Pushed " + ((.payload.commits | length | tostring) // "0") + " commit(s) to [" + .repo.name + "](https://github.com/" + .repo.name + ")"
            elif .type == "PullRequestEvent" then
              "- 🔃 " + (.payload.action // "updated") + " a pull request in [" + .repo.name + "](https://github.com/" + .repo.name + ")"
            elif .type == "IssuesEvent" then
              "- ❗ " + (.payload.action // "updated") + " an issue in [" + .repo.name + "](https://github.com/" + .repo.name + ")"
            elif .type == "WatchEvent" then
              "- ⭐ Starred [" + .repo.name + "](https://github.com/" + .repo.name + ")"
            elif .type == "CreateEvent" then
              "- 📌 Created " + (.payload.ref_type // "resource") + " in [" + .repo.name + "](https://github.com/" + .repo.name + ")"
            else
              "- 🔔 " + (.type | gsub("Event$"; "")) + " in [" + .repo.name + "](https://github.com/" + .repo.name + ")"
            end
          ' recent-events.json > recent-activity.md

          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          start = "<!--START_SECTION:activity-->"
          end = "<!--END_SECTION:activity-->"
          content = readme.read_text(encoding="utf-8")
          if start not in content or end not in content:
              raise SystemExit("README activity markers not found")

          activity = Path("recent-activity.md").read_text(encoding="utf-8").strip()
          replacement = f"{start}\n{activity}\n{end}"
          before, rest = content.split(start, 1)
          _, after = rest.split(end, 1)
          updated = before + replacement + after
          readme.write_text(updated, encoding="utf-8")
          PY

      - name: Commit and push if needed
        run: |
          git config user.name "GitHub Activity Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "No README changes detected."
            exit 0
          fi
          git add README.md
          git commit -m "chore: update recent activity"
          git push
